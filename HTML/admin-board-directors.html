<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة - مجلس الإدارة</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Base.css">
  <style>
    body{background:#f5f7fb}
    .card-admin{border-radius:8px}
    .result-box{white-space:pre-wrap;background:#fff;padding:12px;border-radius:6px;max-height:160px;overflow:auto}
  </style>
</head>
<body>
  <div class="container" style="margin-top:24px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>مجلس الإدارة - إدارة</h3>
      <div>
        <a class="btn btn-secondary" href="/HTML/admin-crud.html">العودة</a>
      </div>
    </div>

    <div class="top-actions d-flex gap-2">
      <button id="refresh" class="btn btn-outline-primary">تحديث القائمة</button>
      <button id="add-new" class="btn btn-outline-success">إضافة عضو جديد</button>
    </div>

    <div id="members" class="mb-3"></div>

    <!-- Create Modal -->
    <div id="create-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:8px;padding:18px;max-width:520px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,0.2);direction:rtl;text-align:right">
        <h4 style="margin-top:0">إضافة عضو لمجلس الإدارة</h4>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label>الاسم</label>
          <input id="create-name" type="text" class="form-control" placeholder="الاسم">
          <label>المنصب</label>
          <input id="create-position" type="text" class="form-control" placeholder="المنصب">
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
            <button id="create-cancel" class="btn btn-secondary">إلغاء</button>
            <button id="create-submit" class="btn btn-success">إنشاء</button>
          </div>
          <div id="create-msg" style="color:#333;font-size:0.95rem;margin-top:6px"></div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:8px;padding:18px;max-width:520px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,0.2);direction:rtl;text-align:right">
        <h4 style="margin-top:0">تعديل عضو مجلس الإدارة</h4>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label>الاسم</label>
          <input id="edit-name" type="text" class="form-control" placeholder="الاسم">
          <label>المنصب</label>
          <input id="edit-position" type="text" class="form-control" placeholder="المنصب">
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
            <button id="edit-cancel" class="btn btn-secondary">إلغاء</button>
            <button id="edit-submit" class="btn btn-primary">حفظ</button>
          </div>
          <div id="edit-msg" style="color:#333;font-size:0.95rem;margin-top:6px"></div>
        </div>
      </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div id="confirm-delete-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:10000;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:8px;padding:18px;max-width:480px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,0.2);direction:rtl;text-align:right">
        <h5 style="margin-top:0">تأكيد الحذف</h5>
        <div id="confirm-delete-message" style="margin-bottom:12px;color:#333"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button id="confirm-delete-cancel" class="btn btn-secondary">إلغاء</button>
          <button id="confirm-delete-ok" class="btn btn-danger">حذف</button>
        </div>
      </div>
    </div>

  </div>

<script>
  const API = 'https://tanmia.nasatechnology.net/api/Board_of_Director';
  const membersEl = document.getElementById('members');

  function showResult(title, data){ console.log(title, data); }

  async function sendRequest(method='GET', id=null, body=null){
    let url = API + (id ? '/' + encodeURIComponent(id) : '');
    const opts = { method, headers: {} };
    const token = localStorage.getItem('authToken');
    if(token) opts.headers['Authorization'] = 'Bearer ' + token;
    if(body && !(body instanceof FormData)){ opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
    else if(body) opts.body = body;
    try{
      const res = await fetch(url, opts);
      const text = await res.text(); let data; try{ data = JSON.parse(text); }catch(e){ data = text }
      showResult(`${method} ${url} → ${res.status}`, data);
      return { ok: res.ok, status: res.status, data };
    }catch(err){ console.error(err); showResult('خطأ', err); return { ok:false, error:err }; }
  }

  async function loadMembers(){
    membersEl.innerHTML = '<div class="text-muted">جاري التحميل...</div>';
    try{
      const res = await fetch(API);
      if(!res.ok) throw new Error('Status ' + res.status);
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data && data.data ? data.data : []);
      renderList(list.filter(m => !(m && (m.isDelete == 1 || m.isDelete === true))));
    }catch(err){ membersEl.innerHTML = '<div class="text-danger">فشل في جلب البيانات</div>'; showResult('خطأ في التحميل', err); }
  }

  function renderList(arr){
    membersEl.innerHTML = '';
    if(!arr || arr.length === 0){ membersEl.innerHTML = '<div class="text-muted">لا توجد أعضاء</div>'; membersEl._list = []; return; }
    arr.forEach((item, idx)=>{
      const name = item.name || item.memberName || ('عضو ' + (idx+1));
      const position = item.position || '';
      const card = document.createElement('div');
      card.className = 'card card-admin mb-2';
      card.innerHTML = `
        <div class="card-body d-flex align-items-center">
          <div class="flex-grow-1"><strong>${name}</strong><div class="text-muted">${position}</div></div>
          <div class="btn-group">
            <button class="btn btn-sm btn-outline-warning" data-idx="${idx}" data-action="edit">تعديل</button>
            <button class="btn btn-sm btn-outline-danger" data-idx="${idx}" data-action="delete">حذف</button>
          </div>
        </div>
      `;
      membersEl.appendChild(card);
    });
    membersEl._list = arr;
  }

  document.addEventListener('click', async (e)=>{
    const btn = e.target.closest('button'); if(!btn) return;
    if(btn.id === 'refresh') return loadMembers();
    if(btn.id === 'add-new') return openCreateModal();
    const action = btn.dataset.action; const idx = btn.dataset.idx; if(!action) return;
    const list = membersEl._list || []; const item = list[idx]; if(!item) return alert('العنصر غير موجود');
    const id = item.id || item._id || item.ID || item.Id;
    if(action === 'delete'){
      const displayName = item.name || item.memberName || '';
      openDeleteConfirm('هل أنت متأكد من حذف العضو "' + displayName + '"؟', async ()=>{
        const res = await sendRequest('DELETE', id);
        if(res.ok) loadMembers();
      });
      return;
    }
    if(action === 'edit'){
      openEditModal(item, id);
      return;
    }
  });

  // Create modal handlers
  function openCreateModal(){
    const modal = document.getElementById('create-modal');
    const nameInput = document.getElementById('create-name');
    const positionInput = document.getElementById('create-position');
    const msg = document.getElementById('create-msg');
    nameInput.value = '';
    positionInput.value = '';
    msg.textContent = '';
    modal.style.display = 'flex';

    const submit = document.getElementById('create-submit');
    const cancel = document.getElementById('create-cancel');

    const onCancel = ()=>{ modal.style.display='none'; cleanup(); };

    const onSubmit = async ()=>{
      const name = nameInput.value.trim(); const position = positionInput.value.trim();
      if(!name){ msg.textContent='أدخل الاسم'; return }
      const token = localStorage.getItem('authToken'); if(!token){ alert('غير مسجل دخول'); return }
      try{
        const res = await fetch(API, { method:'POST', headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' }, body: JSON.stringify({ name, position }) });
        const txt = await res.text(); let data; try{ data = JSON.parse(txt);}catch(e){ data = txt }
        showResult('POST board → '+res.status, data);
        if(res.ok){ modal.style.display='none'; cleanup(); loadMembers(); } else msg.textContent='فشل الإنشاء';
      }catch(err){ console.error(err); msg.textContent='خطأ في الاتصال'; }
    };

    function cleanup(){ submit.removeEventListener('click', onSubmit); cancel.removeEventListener('click', onCancel); }
    submit.addEventListener('click', onSubmit);
    cancel.addEventListener('click', onCancel);
    modal.onclick = function(e){ if(e.target===modal){ modal.style.display='none'; cleanup(); } };
  }

  // Edit modal
  function openEditModal(item, id){
    const modal = document.getElementById('edit-modal'); const nameInput = document.getElementById('edit-name'); const posInput = document.getElementById('edit-position'); const msg = document.getElementById('edit-msg'); if(!modal) return;
    nameInput.value = item.name || item.memberName || '';
    posInput.value = item.position || '';
    msg.textContent=''; modal.style.display='flex';
    const submit = document.getElementById('edit-submit'); const cancel = document.getElementById('edit-cancel');
    const onCancel = ()=>{ modal.style.display='none'; remove(); };
    const onSubmit = async ()=>{
      const newName = nameInput.value.trim(); const newPos = posInput.value.trim(); if(!newName){ msg.textContent='أدخل الاسم'; return }
      const token = localStorage.getItem('authToken'); if(!token){ alert('غير مسجل دخول'); return }
      try{
        const res = await fetch(API+'/'+encodeURIComponent(id), { method:'PUT', headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' }, body: JSON.stringify({ name: newName, position: newPos }) });
        const txt = await res.text(); let data; try{ data = JSON.parse(txt);}catch(e){ data = txt }
        showResult('PUT board → '+res.status, data);
        if(res.ok){ modal.style.display='none'; remove(); loadMembers(); } else msg.textContent='فشل التحديث';
      }catch(err){ console.error(err); msg.textContent='خطأ في الاتصال'; }
    };
    function remove(){ submit.removeEventListener('click', onSubmit); cancel.removeEventListener('click', onCancel); }
    submit.addEventListener('click', onSubmit); cancel.addEventListener('click', onCancel);
    modal.onclick = function(e){ if(e.target===modal){ modal.style.display='none'; remove(); } };
  }

  // init
  function openDeleteConfirm(message, onConfirm){
    const modal = document.getElementById('confirm-delete-modal');
    const msgEl = document.getElementById('confirm-delete-message');
    const ok = document.getElementById('confirm-delete-ok');
    const cancel = document.getElementById('confirm-delete-cancel');
    if(!modal || !ok || !cancel || !msgEl){ alert('حدث خطأ في نافذة التأكيد'); return }
    msgEl.textContent = message || '';
    modal.style.display = 'flex';
    const clean = ()=>{ ok.removeEventListener('click', onOk); cancel.removeEventListener('click', onCancel); modal.style.display='none'; };
    const onOk = async ()=>{ clean(); try{ await onConfirm(); }catch(e){ console.error(e); } };
    const onCancel = ()=>{ clean(); };
    ok.addEventListener('click', onOk);
    cancel.addEventListener('click', onCancel);
    modal.onclick = function(e){ if(e.target===modal){ clean(); } };
  }

  loadMembers();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
