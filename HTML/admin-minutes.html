<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة - محاضر الجمعية العمومية</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Base.css">
  <style>
    body{background:#f5f7fb}
    .card-admin{border-radius:8px}
  </style>
</head>
<body>
  <div class="container" style="margin-top:24px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>محاضر الجمعية العمومية - إدارة</h3>
      <div>
        <a class="btn btn-secondary" href="/HTML/admin-crud.html">العودة</a>
      </div>
    </div>

    <div class="top-actions d-flex gap-2 mb-3">
      <button id="refresh" class="btn btn-outline-primary">تحديث القائمة</button>
      <button id="add-new" class="btn btn-outline-success">إضافة محضر جديد</button>
    </div>

    <div id="minutes-list"></div>

    <!-- Create modal (PDF only) -->
    <div id="create-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:8px;padding:18px;max-width:520px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,0.2);direction:rtl;text-align:right">
        <h4 style="margin-top:0">إضافة محضر</h4>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label>اختر ملف (أي نوع)</label>
          <input id="create-file" type="file" accept="*/*" class="form-control">
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
            <button id="create-cancel" class="btn btn-secondary">إلغاء</button>
            <button id="create-submit" class="btn btn-success">إنشاء</button>
          </div>
          <div id="create-msg" style="color:#333;font-size:0.95rem;margin-top:6px"></div>
        </div>
      </div>
    </div>

    <!-- Edit modal (replace PDF) -->
    <div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:8px;padding:18px;max-width:520px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,0.2);direction:rtl;text-align:right">
          <h4 style="margin-top:0">تعديل المحضر (استبدال الملف)</h4>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label>اختر ملف جديد</label>
          <input id="edit-file" type="file" accept="*/*" class="form-control">
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
            <button id="edit-cancel" class="btn btn-secondary">إلغاء</button>
            <button id="edit-submit" class="btn btn-primary">حفظ</button>
          </div>
          <div id="edit-msg" style="color:#333;font-size:0.95rem;margin-top:6px"></div>
        </div>
      </div>
    </div>

  </div>
  </div>

  <script src="../JS/confirm-modal.js"></script>
  <script>
    const API = 'https://tanmia.nasatechnology.net/api/Association_Minute';
    const listEl = document.getElementById('minutes-list');

    function showResult(title, data){ console.log(title, data); }

    async function loadMinutes(){
      listEl.innerHTML = '<div class="text-muted">جاري التحميل...</div>';
      try{
        const res = await fetch(API);
        if(!res.ok) throw new Error('Status ' + res.status);
        const data = await res.json();
        const arr = Array.isArray(data) ? data : (data && data.data ? data.data : []);
        const filtered = arr.filter(i => !(i && (i.isDelete == 1 || i.isDelete === true)));
        renderList(filtered);
      }catch(err){ listEl.innerHTML = '<div class="text-danger">فشل في جلب البيانات</div>'; showResult('خطأ في التحميل', err); }
    }

    function renderList(items){
      listEl.innerHTML = '';
      if(!items || items.length === 0){ listEl.innerHTML = '<div class="text-muted">لا توجد محاضر</div>'; return; }
      items.forEach((it, idx)=>{
        const id = it.id || it._id || it.ID || it.Id || idx;
        const url = it.MinutesURL || it.minutesURL || it.minutesUrl || it.file || it.url || '#';
        // derive filename from URL when possible (prefer backend field name or decode last path segment)
        function filenameFromUrl(u){ try{ if(!u || u === '#') return null; const clean = u.split('?')[0].split('/').pop(); return decodeURIComponent(clean.replace(/\+/g,' ')); }catch(e){ return null } }
        const derivedName = filenameFromUrl(url);
        const title = it.title || it.name || derivedName || ('محضر ' + (idx+1));
        const card = document.createElement('div');
        card.className = 'card mb-2 shadow-sm';
        card.innerHTML = `
          <div class="card-body d-flex align-items-center">
            <img src="/images/pdf2.png" alt="pdf" style="width:48px;margin-left:12px">
            <div class="flex-grow-1"><strong title="${url}">${title}</strong></div>
            <div class="btn-group">
              <a href="${url}" target="_blank" class="btn btn-sm btn-primary">فتح الملف</a>
              <button class="btn btn-sm btn-outline-warning" data-idx="${idx}" data-action="edit">تعديل</button>
              <button class="btn btn-sm btn-outline-danger" data-idx="${idx}" data-action="delete">حذف</button>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });
      listEl._items = items;
    }

    document.addEventListener('click', async (e)=>{
      const btn = e.target.closest('button'); if(!btn) return;
      if(btn.id === 'refresh') return loadMinutes();
      if(btn.id === 'add-new') return openCreateModal();
      const action = btn.dataset.action; const idx = btn.dataset.idx; if(!action) return;
      const items = listEl._items || []; const item = items[idx]; if(!item) return alert('العنصر غير موجود');
      const id = item.id || item._id || item.ID || item.Id;
      if(action === 'delete'){
        const display = item.title || item.name || 'محضر';
        openDeleteConfirm('هل أنت متأكد من حذف ' + display + '؟', async ()=>{
          const token = localStorage.getItem('authToken');
          const res = await fetch(API + '/' + encodeURIComponent(id), { method:'DELETE', headers: token ? { 'Authorization':'Bearer '+token } : {} });
          if(res.ok) loadMinutes(); else { const txt = await res.text(); showResult('DELETE → '+res.status, txt); alert('فشل الحذف'); }
        });
        return;
      }
      if(action === 'edit'){
        openEditModal(item, id);
        return;
      }
    });

    // Create modal (PDF required)
    function openCreateModal(){
      const modal = document.getElementById('create-modal');
      const fileInput = document.getElementById('create-file');
      const msg = document.getElementById('create-msg');
      fileInput.value = ''; msg.textContent = ''; modal.style.display = 'flex';
      const submit = document.getElementById('create-submit');
      const cancel = document.getElementById('create-cancel');
      const onCancel = ()=>{ modal.style.display='none'; cleanup(); };
      const onSubmit = async ()=>{
        const file = fileInput.files && fileInput.files[0];
        if(!file){ msg.textContent = 'اختر ملف'; return }
        const token = localStorage.getItem('authToken'); if(!token){ alert('غير مسجل دخول'); return }
        const form = new FormData(); form.append('MinutesURL', file, file.name);
        try{
          const res = await fetch(API, { method:'POST', headers: { 'Authorization':'Bearer ' + token }, body: form });
          const txt = await res.text(); let data; try{ data = JSON.parse(txt);}catch(e){ data = txt }
          showResult('POST minutes → '+res.status, data);
          if(res.ok){ modal.style.display='none'; cleanup(); loadMinutes(); } else msg.textContent='فشل الإنشاء';
        }catch(err){ console.error(err); msg.textContent='خطأ في الاتصال'; }
      };
      function cleanup(){ submit.removeEventListener('click', onSubmit); cancel.removeEventListener('click', onCancel); }
      submit.addEventListener('click', onSubmit); cancel.addEventListener('click', onCancel);
      modal.onclick = function(e){ if(e.target===modal){ modal.style.display='none'; cleanup(); } };
    }

    // Edit modal (replace PDF)
    function openEditModal(item, id){
      const modal = document.getElementById('edit-modal');
      const fileInput = document.getElementById('edit-file');
      const msg = document.getElementById('edit-msg');
      fileInput.value = ''; msg.textContent = ''; modal.style.display = 'flex';
      const submit = document.getElementById('edit-submit');
      const cancel = document.getElementById('edit-cancel');
      const onCancel = ()=>{ modal.style.display='none'; cleanup(); };
      const onSubmit = async ()=>{
        const file = fileInput.files && fileInput.files[0];
        if(!file){ msg.textContent='اختر ملف'; return }
        const token = localStorage.getItem('authToken'); if(!token){ alert('غير مسجل دخول'); return }
        const form = new FormData(); form.append('MinutesURL', file, file.name);
        try{
          const res = await fetch(API + '/' + encodeURIComponent(id), { method:'PUT', headers: { 'Authorization':'Bearer ' + token }, body: form });
          const txt = await res.text(); let data; try{ data = JSON.parse(txt);}catch(e){ data = txt }
          showResult('PUT minutes → '+res.status, data);
          if(res.ok){ modal.style.display='none'; cleanup(); loadMinutes(); } else msg.textContent='فشل التحديث';
        }catch(err){ console.error(err); msg.textContent='خطأ في الاتصال'; }
      };
      function cleanup(){ submit.removeEventListener('click', onSubmit); cancel.removeEventListener('click', onCancel); }
      submit.addEventListener('click', onSubmit); cancel.addEventListener('click', onCancel);
      modal.onclick = function(e){ if(e.target===modal){ modal.style.display='none'; cleanup(); } };
    }

    // init
    loadMinutes();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/JS/custom-alert.js"></script>
</body>
</html>
