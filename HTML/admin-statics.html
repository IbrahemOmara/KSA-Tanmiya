<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة - الإحصائيات والمساعدات</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Base.css">
  <style>
    body{background:#f5f7fb}
    .card-admin{border-radius:8px}
    label{font-weight:600}
  </style>
</head>
<body>
  <div class="container" style="margin-top:24px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>الإحصائيات والمساعدات - إدارة</h3>
      <div>
        <a class="btn btn-secondary" href="/HTML/admin-crud.html">العودة</a>
      </div>
    </div>

    <div class="card mb-4" style="border: 1px solid #007c8b;">
      <div class="card-header text-white" style="background-color: #007c8b;">
        محتوى الإحصائيات والمساعدات (يظهر في الصفحة)
      </div>
      <div class="card-body">
        <textarea id="statics-text" class="form-control" rows="15" placeholder="اكتب محتوى الإحصائيات هنا (يمكن استخدام HTML)..."></textarea>
        <div class="mt-2 d-flex justify-content-end">
          <button id="save-statics" class="btn btn-success">حفظ الإحصائيات</button>
        </div>
        <div id="statics-msg" class="mt-2"></div>
      </div>
    </div>
  </div>

  <script>
    const defaultHTML = `<h4>الإحصائيات و المساعدات لعام ٢٠٢٣م</h4>
<ul>
    <li>
        برامج و انشطه الجمعية: برنامج واحد
    </li>
    <li>
        عدد المستفيدين: تجاوز عدد المستفيدين ما يقارب من ٩١ مستفيد
    </li>
</ul>

<h4>الإحصائيات و المساعدات لعام ٢٠٢٤م</h4>
<ul>
    <li>
        برامج و انشطه الجمعية: ٧ برامج و ٨ دورات و ٣ مبادرات
    </li>
    <li>
        عدد المستفيدين: تجاوز عدد المستفيدين ما يقارب من ٣٢٥٠ مستفيد بقيمه ٣٥٨,٣٠٠ ريال
    </li>
</ul>`;

    function loadStatics() {
        let text = localStorage.getItem('staticsData');
        if(!text) {
            text = defaultHTML;
        }
        document.getElementById('statics-text').value = text;
    }

    document.getElementById('save-statics').addEventListener('click', () => {
        const text = document.getElementById('statics-text').value;
        const msg = document.getElementById('statics-msg');
        
        localStorage.setItem('staticsData', text);
        msg.innerHTML = '<span class="text-success">تم حفظ البيانات بنجاح محلياً!</span>';
        
        setTimeout(() => msg.innerHTML='', 3000);
    });

    loadStatics();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/JS/custom-alert.js"></script>
</body>
</html>
