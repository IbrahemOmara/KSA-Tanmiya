<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة - التقارير السنوية</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Base.css">
  <style>
    body{background:#f5f7fb}
    .card-admin{border-radius:8px}
    .top-actions{margin:18px 0}
    .result-box{white-space:pre-wrap;background:#fff;padding:12px;border-radius:6px;max-height:160px;overflow:auto}
  </style>
</head>
<body>
  <div class="container" style="margin-top:24px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>التقارير السنوية - إدارة</h3>
      <div>
        <a class="btn btn-secondary" href="/HTML/admin-crud.html">العودة</a>
      </div>
    </div>

    <div class="top-actions d-flex gap-2">
      <button id="refresh" class="btn btn-outline-primary">تحديث القائمة</button>
      <button id="add-new" class="btn btn-outline-success">إضافة تقرير جديد</button>
    </div>

    <div id="reports" class="mb-3"></div>

    <!-- Create Report Modal -->
    <div id="create-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:8px;padding:18px;max-width:520px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,0.2);direction:rtl;text-align:right">
        <h4 style="margin-top:0">إضافة تقرير جديد</h4>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label>اسم التقرير</label>
          <input id="create-name" type="text" class="form-control" placeholder="اسم التقرير">
          <label>ملف التقرير (PDF فقط)</label>
          <input id="create-file" type="file" accept="application/pdf" class="form-control">
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
            <button id="create-cancel" class="btn btn-secondary">إلغاء</button>
            <button id="create-submit" class="btn btn-success">إنشاء</button>
          </div>
          <div id="create-msg" style="color:#333;font-size:0.95rem;margin-top:6px"></div>
        </div>
      </div>
    </div>

    <!-- Edit Report Modal -->
    <div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:8px;padding:18px;max-width:520px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,0.2);direction:rtl;text-align:right">
        <h4 style="margin-top:0">تعديل التقرير</h4>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label>اسم التقرير</label>
          <input id="edit-name" type="text" class="form-control" placeholder="اسم التقرير">
          <label>ملف التقرير (PDF فقط)</label>
          <input id="edit-file" type="file" accept="application/pdf" class="form-control">
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
            <button id="edit-cancel" class="btn btn-secondary">إلغاء</button>
            <button id="edit-submit" class="btn btn-primary">حفظ التغييرات</button>
          </div>
          <div id="edit-msg" style="color:#333;font-size:0.95rem;margin-top:6px"></div>
        </div>
      </div>
    </div>

    <!-- result box removed (status logged to console) -->
  </div>
  </div>

<script src="../JS/confirm-modal.js"></script>
<script>
  const API = 'https://tanmia.nasatechnology.net/api/Annual_report';
  const reportsEl = document.getElementById('reports');
  const resultEl = document.getElementById('result'); // may be removed from DOM

  function showResult(title, data){
    if(resultEl) resultEl.textContent = title + '\n\n' + (typeof data === 'string' ? data : JSON.stringify(data, null, 2));
    else console.log(title, data);
  }

  async function sendRequest(method='GET', id=null, body=null){
    let url = API + (id ? '/' + encodeURIComponent(id) : '');
    const opts = { method, headers: {} };
    // include auth token if present
    const token = localStorage.getItem('authToken');
    if(token){ opts.headers['Authorization'] = 'Bearer ' + token; }
    if(body){ opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
    try{
      const res = await fetch(url, opts);
      const text = await res.text();
      let data; try{ data = JSON.parse(text); }catch(e){ data = text }
      showResult(`${method} ${url} → ${res.status} ${res.statusText}`, data);
      return {ok: res.ok, status: res.status, data};
    }catch(err){
      console.error(err);
      showResult('خطأ في الاتصال', err.message || err);
      return {ok:false, error:err};
    }
  }

  async function loadReports(){
    reportsEl.innerHTML = '<div class="text-muted">جاري التحميل...</div>';
    try{
      const res = await fetch(API);
      if(!res.ok) throw new Error('Status ' + res.status);
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data && data.data ? data.data : []);
      renderList(list);
      showResult('تم جلب التقارير', list);
    }catch(err){
      reportsEl.innerHTML = '<div class="text-danger">فشل في جلب البيانات</div>';
      showResult('خطأ في تحميل التقارير', err.message || err);
    }
  }

  function renderList(arr){
    reportsEl.innerHTML = '';
    // filter out items marked as deleted (isDelete === 1 or true)
    const visible = (arr || []).filter(item => !(item && (item.isDelete == 1 || item.isDelete === true)));
    if(!visible || visible.length === 0){
      reportsEl.innerHTML = '<div class="text-muted">لا توجد تقارير سنوية</div>';
      reportsEl._list = [];
      return;
    }

    visible.forEach((item, idx)=>{
      const id = item.id || item._id || item.ID || item.Id || idx;
      const name = item.reportName || item.title || item.name || ('التقرير ' + (idx+1));

      const card = document.createElement('div');
      card.className = 'card card-admin mb-2';
      card.innerHTML = `
        <div class="card-body d-flex align-items-center">
          <img src="/images/pdf2.png" style="width:48px;margin-left:12px">
          <div class="flex-grow-1">
            <div><strong>${name}</strong></div>
          </div>
          <div class="btn-group">
            <a href="${item.reportURL || '#'}" target="_blank" class="btn btn-sm btn-primary">فتح الملف</a>
            <button class="btn btn-sm btn-outline-warning" data-idx="${idx}" data-action="edit">تعديل</button>
            <button class="btn btn-sm btn-outline-danger" data-idx="${idx}" data-action="delete">حذف</button>
          </div>
        </div>
      `;
      reportsEl.appendChild(card);
    });

    // store current visible list for actions
    reportsEl._list = visible;
  }

  document.addEventListener('click', async (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;

    if(btn.id === 'refresh') return loadReports();
    if(btn.id === 'add-new'){
      openCreateModal();
      return;
    }

    const action = btn.dataset.action;
    const idx = btn.dataset.idx;
    if(!action) return;
    const list = reportsEl._list || [];
    const item = list[idx];
    if(!item) return alert('العنصر غير موجود');
    const id = item.id || item._id || item.ID || item.Id;

    if(action === 'edit'){
      // open professional edit modal
      openEditModal(item, id);
      return;
    }

    if(action === 'delete'){
      openDeleteConfirm('هل تريد حذف التقرير المعرف ' + id + '؟', async ()=>{
        const ok = await deleteReport(id);
        if(ok) loadReports();
      });
      return;
    }
  });

  // helper: open a file picker and return the selected File (promise)
  function promptForFile(){
    return new Promise((resolve, reject)=>{
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '*/*';
      inp.style.display = 'none';
      document.body.appendChild(inp);
      inp.addEventListener('change', function(){
        const f = inp.files && inp.files[0];
        document.body.removeChild(inp);
        resolve(f);
      });
      inp.click();
      // timeout in case user cancels
      setTimeout(()=>{
        // if input still in document and no files selected, resolve null
        if(document.body.contains(inp) && !(inp.files && inp.files.length)){
          try{ document.body.removeChild(inp); }catch(e){}
          resolve(null);
        }
      }, 60000);
    });
  }

  // Edit modal logic
  function openEditModal(item, id){
    const modal = document.getElementById('edit-modal');
    const nameInput = document.getElementById('edit-name');
    const fileInput = document.getElementById('edit-file');
    const msg = document.getElementById('edit-msg');
    if(!modal) return;
    nameInput.value = item.reportName || item.ReportName || item.title || item.name || '';
    fileInput.value = '';
    msg.textContent = '';
    modal.style.display = 'flex';

    // attach one-time handlers
    const submit = document.getElementById('edit-submit');
    const cancel = document.getElementById('edit-cancel');

    const onCancel = ()=>{ modal.style.display='none'; removeHandlers(); };
    const onSubmit = async ()=>{
      const newName = nameInput.value.trim();
      const file = fileInput.files && fileInput.files[0];
      if(!newName){ msg.textContent = 'أدخل اسم التقرير'; return }
      if(!file){ msg.textContent = 'اختر ملف PDF للتقرير'; return }
      if(file.type !== 'application/pdf'){ msg.textContent = 'الملف يجب أن يكون بصيغة PDF'; return }
      msg.textContent = 'جاري رفع الملف وتحديث التقرير...';
      const token = localStorage.getItem('authToken');
      if(!token){ alert('غير مسجل دخول - يرجى تسجيل الدخول أولاً'); return }
      const form = new FormData();
      form.append('ReportName', newName);
      form.append('ReportURL', file, file.name);
      try{
        const res = await fetch(API + '/' + encodeURIComponent(id), { method: 'PUT', headers: { 'Authorization': 'Bearer ' + token }, body: form });
        const txt = await res.text(); let data; try{ data = JSON.parse(txt); }catch(e){ data = txt }
        showResult(`PUT ${API}/${id} → ${res.status} ${res.statusText}`, data);
        if(res.ok){ modal.style.display='none'; removeHandlers(); loadReports(); }
        else msg.textContent = 'فشل في التحديث: ' + (res.status);
      }catch(err){ console.error(err); msg.textContent = 'خطأ في الاتصال'; }
    };

    function removeHandlers(){ submit.removeEventListener('click', onSubmit); cancel.removeEventListener('click', onCancel); }
    submit.addEventListener('click', onSubmit);
    cancel.addEventListener('click', onCancel);
    // close modal when clicking outside inner box
    modal.onclick = function(e){ if(e.target === modal){ modal.style.display='none'; removeHandlers(); } };
  }

  // Create modal logic
  function openCreateModal(){
    const modal = document.getElementById('create-modal');
    const nameInput = document.getElementById('create-name');
    const fileInput = document.getElementById('create-file');
    const msg = document.getElementById('create-msg');
    if(!modal) return;
    nameInput.value = '';
    fileInput.value = '';
    msg.textContent = '';
    modal.style.display = 'flex';

    const submit = document.getElementById('create-submit');
    const cancel = document.getElementById('create-cancel');

    const onCancel = ()=>{ modal.style.display='none'; removeHandlers(); };
    const onSubmit = async ()=>{
      const newName = nameInput.value.trim();
      const file = fileInput.files && fileInput.files[0];
      if(!newName){ msg.textContent = 'أدخل اسم التقرير'; return }
      if(!file){ msg.textContent = 'اختر ملف PDF للتقرير'; return }
      if(file.type !== 'application/pdf'){ msg.textContent = 'الملف يجب أن يكون بصيغة PDF'; return }
      msg.textContent = 'جاري رفع الملف وإنشاء التقرير...';
      const token = localStorage.getItem('authToken');
      if(!token){ alert('غير مسجل دخول - يرجى تسجيل الدخول أولاً'); return }
      const form = new FormData();
      form.append('ReportName', newName);
      form.append('ReportURL', file, file.name);
      try{
        const res = await fetch(API, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: form });
        const txt = await res.text(); let data; try{ data = JSON.parse(txt); }catch(e){ data = txt }
        showResult(`POST ${API} → ${res.status} ${res.statusText}`, data);
        if(res.ok){ modal.style.display='none'; removeHandlers(); loadReports(); }
        else msg.textContent = 'فشل في الإنشاء: ' + (res.status);
      }catch(err){ console.error(err); msg.textContent = 'خطأ في الاتصال'; }
    };

    function removeHandlers(){ submit.removeEventListener('click', onSubmit); cancel.removeEventListener('click', onCancel); }
    submit.addEventListener('click', onSubmit);
    cancel.addEventListener('click', onCancel);
    modal.onclick = function(e){ if(e.target === modal){ modal.style.display='none'; removeHandlers(); } };
  }

  async function deleteReport(id){
    if(!id) { alert('معرف مفقود'); return false }
    const token = localStorage.getItem('authToken');
    if(!token){ alert('غير مسجل دخول - يرجى تسجيل الدخول أولاً'); return false }
    const url = API + '/' + encodeURIComponent(id);
    try{
      const res = await fetch(url, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
      let text = '';
      try{ text = await res.text(); }catch(e){}
      let data;
      try{ data = JSON.parse(text); }catch(e){ data = text }
      showResult(`DELETE ${url} → ${res.status} ${res.statusText}`, data);
      if(!res.ok) return false;
      return true;
    }catch(err){
      console.error('deleteReport error', err);
      showResult('خطأ في الحذف', err.message || err);
      return false;
    }
  }

  // init
  loadReports();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
