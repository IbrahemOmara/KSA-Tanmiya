<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة - أعضاء الجمعية</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Base.css">
  <style>
    body{background:#f5f7fb}
    .card-admin{border-radius:8px}
    .result-box{white-space:pre-wrap;background:#fff;padding:12px;border-radius:6px;max-height:160px;overflow:auto}
  </style>
</head>
<body>
  <div class="container" style="margin-top:24px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>أعضاء الجمعية - إدارة</h3>
      <div>
        <a class="btn btn-secondary" href="/HTML/admin-crud.html">العودة</a>
      </div>
    </div>

    <div class="top-actions d-flex gap-2">
      <button id="refresh" class="btn btn-outline-primary">تحديث القائمة</button>
      <button id="add-new" class="btn btn-outline-success">إضافة عضو جديد</button>
      <button id="save-order" class="btn btn-outline-info" style="display:none;">حفظ الترتيب</button>
    </div>

    <div id="members" class="mb-3"></div>

    <!-- Create Member Modal -->
    <div id="create-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:8px;padding:18px;max-width:520px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,0.2);direction:rtl;text-align:right">
        <h4 style="margin-top:0">إضافة عضو</h4>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label>اسم العضو</label>
          <input id="create-name" type="text" class="form-control" placeholder="اسم العضو">
          <!-- API expects only the name field (no file upload) -->
          <!-- Removed file input: server requires { "name": "..." } -->
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
            <button id="create-cancel" class="btn btn-secondary">إلغاء</button>
            <button id="create-submit" class="btn btn-success">إنشاء</button>
          </div>
          <div id="create-msg" style="color:#333;font-size:0.95rem;margin-top:6px"></div>
        </div>
      </div>
    </div>

    <!-- Edit Member Modal (name only) -->
    <div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:8px;padding:18px;max-width:520px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,0.2);direction:rtl;text-align:right">
        <h4 style="margin-top:0">تعديل العضو</h4>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label>اسم العضو</label>
          <input id="edit-name" type="text" class="form-control" placeholder="اسم العضو">
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
            <button id="edit-cancel" class="btn btn-secondary">إلغاء</button>
            <button id="edit-submit" class="btn btn-primary">حفظ</button>
          </div>
          <div id="edit-msg" style="color:#333;font-size:0.95rem;margin-top:6px"></div>
        </div>
      </div>
    </div>

  </div>
  </div>

<script src="../JS/confirm-modal.js"></script>
<script>
  const API = 'https://tanmia.nasatechnology.net/api/Association_Member';
  const membersEl = document.getElementById('members');

  function showResult(title, data){ console.log(title, data); }

  async function sendRequest(method='GET', id=null, body=null){
    let url = API + (id ? '/' + encodeURIComponent(id) : '');
    const opts = { method, headers: {} };
    const token = localStorage.getItem('authToken');
    if(token) opts.headers['Authorization'] = 'Bearer ' + token;
    if(body && !(body instanceof FormData)){ opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
    else if(body) opts.body = body;
    try{
      const res = await fetch(url, opts);
      const text = await res.text(); let data; try{ data = JSON.parse(text); }catch(e){ data = text }
      showResult(`${method} ${url} → ${res.status}`, data);
      return { ok: res.ok, status: res.status, data };
    }catch(err){ console.error(err); showResult('خطأ', err); return { ok:false, error:err }; }
  }

  async function loadMembers(){
    membersEl.innerHTML = '<div class="text-muted">جاري التحميل...</div>';
    try{
      const res = await fetch(API);
      if(!res.ok) throw new Error('Status ' + res.status);
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data && data.data ? data.data : []);
      
      let validList = list.filter(m => !(m && (m.isDelete == 1 || m.isDelete === true)));
      
      // Parse order from name
      validList.forEach(item => {
        let rawName = item.memberName || item.name || item.fullName || '';
        let order = 999;
        let cleanName = rawName;
        const match = rawName.match(/^\[ORDER:(\d+)\]\s*(.*)$/);
        if(match){
          order = parseInt(match[1], 10);
          cleanName = match[2];
        }
        item._parsedOrder = order;
        item._cleanName = cleanName;
      });

      // Sort by order 
      validList.sort((a,b) => a._parsedOrder - b._parsedOrder);

      renderList(validList);
    }catch(err){ membersEl.innerHTML = '<div class="text-danger">فشل في جلب البيانات</div>'; showResult('خطأ في التحميل', err); }
  }

  function renderList(arr){
    membersEl.innerHTML = '';
    if(!arr || arr.length === 0){ membersEl.innerHTML = '<div class="text-muted">لا توجد أعضاء</div>'; membersEl._list = []; document.getElementById('save-order').style.display='none'; return; }
    
    document.getElementById('save-order').style.display = arr.length > 1 ? 'block' : 'none';

    arr.forEach((item, idx)=>{
      const name = item._cleanName || ('عضو ' + (idx+1));
      const card = document.createElement('div');
      card.className = 'card card-admin mb-2';
      card.innerHTML = `
        <div class="card-body d-flex align-items-center">
          <div class="ms-3 btn-group-vertical" style="margin-left: 15px;">
            <button class="btn btn-sm btn-light py-0" data-idx="${idx}" data-action="up" ${idx===0?'disabled':''}>⬆</button>
            <button class="btn btn-sm btn-light py-0" data-idx="${idx}" data-action="down" ${idx===arr.length-1?'disabled':''}>⬇</button>
          </div>
          <div class="flex-grow-1"><strong>${name}</strong></div>
          <div class="btn-group">
            <button class="btn btn-sm btn-outline-warning" data-idx="${idx}" data-action="edit">تعديل</button>
            <button class="btn btn-sm btn-outline-danger" data-idx="${idx}" data-action="delete">حذف</button>
          </div>
        </div>
      `;
      membersEl.appendChild(card);
    });
    membersEl._list = arr;
  }

  document.addEventListener('click', async (e)=>{
    const btn = e.target.closest('button'); if(!btn) return;
    if(btn.id === 'refresh') return loadMembers();
    if(btn.id === 'add-new') return openCreateModal();
    if(btn.id === 'save-order') return saveOrder();
    const action = btn.dataset.action; const idx = parseInt(btn.dataset.idx, 10); if(!action || isNaN(idx)) return;
    const list = membersEl._list || []; const item = list[idx]; if(!item) return alert('العنصر غير موجود');
    const id = item.id || item._id || item.ID || item.Id;

    if(action === 'up' && idx > 0) {
      const temp = list[idx-1];
      list[idx-1] = list[idx];
      list[idx] = temp;
      renderList(list);
      return;
    }
    if(action === 'down' && idx < list.length - 1) {
      const temp = list[idx+1];
      list[idx+1] = list[idx];
      list[idx] = temp;
      renderList(list);
      return;
    }

    if(action === 'delete'){
      const displayName = item._cleanName || '';
      openDeleteConfirm('هل أنت متأكد من حذف العضو "' + displayName + '"؟', async ()=>{
        const res = await sendRequest('DELETE', id);
        if(res.ok) loadMembers();
      });
      return;
    }
    if(action === 'edit'){
      openEditModal(item, id);
      return;
    }
  });

  async function saveOrder() {
    const list = membersEl._list || [];
    if(list.length === 0) return;
    const btn = document.getElementById('save-order');
    btn.disabled = true;
    btn.textContent = 'جاري الحفظ...';
    try {
      for(let i=0; i<list.length; i++) {
        const item = list[i];
        const id = item.id || item._id || item.ID || item.Id;
        const newName = `[ORDER:${i}] ` + item._cleanName;
        const payload = { name: newName };
        await sendRequest('PUT', id, payload);
      }
      alert('تم حفظ الترتيب بنجاح');
      loadMembers();
    } catch(err) {
      alert('حدث خطأ أثناء حفظ الترتيب');
    } finally {
      btn.disabled = false;
      btn.textContent = 'حفظ الترتيب';
    }
  }

  // Create modal handlers
  function openCreateModal(){
    const modal = document.getElementById('create-modal');
    const nameInput = document.getElementById('create-name');
    const msg = document.getElementById('create-msg');
    nameInput.value = '';
    msg.textContent = '';
    modal.style.display = 'flex';

    const submit = document.getElementById('create-submit');
    const cancel = document.getElementById('create-cancel');

    const onCancel = ()=>{ modal.style.display='none'; cleanup(); };

    const onSubmit = async ()=>{
      const name = nameInput.value.trim();
      if(!name){ msg.textContent='أدخل اسم العضو'; return }
      const token = localStorage.getItem('authToken'); if(!token){ alert('غير مسجل دخول'); return }
      try{
        const res = await fetch(API, { method:'POST', headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' }, body: JSON.stringify({ name }) });
        const txt = await res.text(); let data; try{ data = JSON.parse(txt);}catch(e){ data = txt }
        showResult('POST member → '+res.status, data);
        if(res.ok){ modal.style.display='none'; cleanup(); loadMembers(); } else msg.textContent='فشل الإنشاء';
      }catch(err){ console.error(err); msg.textContent='خطأ في الاتصال'; }
    };

    function cleanup(){ submit.removeEventListener('click', onSubmit); cancel.removeEventListener('click', onCancel); }
    submit.addEventListener('click', onSubmit);
    cancel.addEventListener('click', onCancel);
    modal.onclick = function(e){ if(e.target===modal){ modal.style.display='none'; cleanup(); } };
  }

  // Edit modal (name only)
  function openEditModal(item, id){
    const modal = document.getElementById('edit-modal'); const nameInput = document.getElementById('edit-name'); const msg = document.getElementById('edit-msg'); if(!modal) return;
    nameInput.value = item._cleanName || ''; msg.textContent=''; modal.style.display='flex';
    const submit = document.getElementById('edit-submit'); const cancel = document.getElementById('edit-cancel');
    const onCancel = ()=>{ modal.style.display='none'; remove(); };
    const onSubmit = async ()=>{
      const newName = nameInput.value.trim(); if(!newName){ msg.textContent='أدخل الاسم'; return }
      const token = localStorage.getItem('authToken'); if(!token){ alert('غير مسجل دخول'); return }
      
      const orderPrefix = item._parsedOrder !== undefined && item._parsedOrder !== 999 ? `[ORDER:${item._parsedOrder}] ` : '';
      const finalName = orderPrefix + newName;

      try{
        const res = await fetch(API+'/'+encodeURIComponent(id), { method:'PUT', headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' }, body: JSON.stringify({ name: finalName }) });
        const txt = await res.text(); let data; try{ data = JSON.parse(txt);}catch(e){ data = txt }
        showResult('PUT member → '+res.status, data);
        if(res.ok){ modal.style.display='none'; remove(); loadMembers(); } else msg.textContent='فشل التحديث';
      }catch(err){ console.error(err); msg.textContent='خطأ في الاتصال'; }
    };
    function remove(){ submit.removeEventListener('click', onSubmit); cancel.removeEventListener('click', onCancel); }
    submit.addEventListener('click', onSubmit); cancel.addEventListener('click', onCancel);
    modal.onclick = function(e){ if(e.target===modal){ modal.style.display='none'; remove(); } };
  }

  // init
  loadMembers();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/JS/custom-alert.js"></script>
</body>
</html>
