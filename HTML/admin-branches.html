<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة - الفروع والمكاتب واللجان</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Base.css">
  <style>
    body { background: #f5f7fb; }
    label { font-weight: 600; }
    .section-card { border: 1px solid #007c8b; }
    .section-card .card-header { background: #007c8b; color: #fff; }
  </style>
</head>
<body>
  <div class="container" style="margin-top:24px; max-width:700px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3>الفروع والمكاتب واللجان - إدارة</h3>
      <a class="btn btn-secondary" href="/HTML/admin-crud.html">العودة</a>
    </div>

    <!-- مقر الجمعية -->
    <div class="card section-card mb-4">
      <div class="card-header">مقر الجمعية</div>
      <div class="card-body">
        <input id="f-hq" type="text" class="form-control" placeholder="مقر الجمعية: المنطقة الشرقية، أم الساهك">
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-field="hq" data-src="f-hq">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- ملاحظة الفروع -->
    <div class="card section-card mb-4">
      <div class="card-header">نص الفروع والمكاتب</div>
      <div class="card-body">
        <input id="f-branch-note" type="text" class="form-control" placeholder="لا توجد للجمعية فروع أو مكاتب أخرى">
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-field="branchNote" data-src="f-branch-note">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- رابط إقرار الفروع -->
    <div class="card section-card mb-4">
      <div class="card-header">رابط إقرار الفروع والمكاتب</div>
      <div class="card-body">
        <input id="f-branch-link" type="text" class="form-control" placeholder="https://drive.google.com/...">
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-field="branchLink" data-src="f-branch-link">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- ملاحظة اللجان -->
    <div class="card section-card mb-4">
      <div class="card-header">نص اللجان</div>
      <div class="card-body">
        <input id="f-committee-note" type="text" class="form-control" placeholder="لا توجد لجان للجمعية">
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-field="committeeNote" data-src="f-committee-note">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- رابط إقرار اللجان -->
    <div class="card section-card mb-4">
      <div class="card-header">رابط إقرار اللجان</div>
      <div class="card-body">
        <input id="f-committee-link" type="text" class="form-control" placeholder="https://drive.google.com/...">
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-field="committeeLink" data-src="f-committee-link">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

  </div>

  <script>
    const defaults = {
      hq:            'مقر الجمعية: المنطقة الشرقية، أم الساهك',
      branchNote:    'لا توجد للجمعية فروع أو مكاتب أخرى',
      branchLink:    'https://drive.google.com/file/d/1Or1bN9-1OOF7f_ZxvXzIkKKri5_x_Taj/view',
      committeeNote: 'لا توجد لجان للجمعية',
      committeeLink: 'https://drive.google.com/file/d/1AGiCSK0Sz_VqkKRVZwbl6MLJCO43j9YS/view'
    };

    const fieldMap = {
      hq:            'f-hq',
      branchNote:    'f-branch-note',
      branchLink:    'f-branch-link',
      committeeNote: 'f-committee-note',
      committeeLink: 'f-committee-link'
    };

    const saved = JSON.parse(localStorage.getItem('branchesData') || '{}');
    Object.entries(fieldMap).forEach(([key, id]) => {
      document.getElementById(id).value = saved[key] || defaults[key];
    });

    document.querySelectorAll('.save-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = JSON.parse(localStorage.getItem('branchesData') || '{}');
        d[btn.dataset.field] = document.getElementById(btn.dataset.src).value.trim();
        localStorage.setItem('branchesData', JSON.stringify(d));
        const msg = btn.closest('.card-body').querySelector('.save-msg');
        msg.innerHTML = '<span class="text-success">✓ تم الحفظ بنجاح!</span>';
        setTimeout(() => msg.innerHTML = '', 3000);
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
