<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة - السياسات واللوائح</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Base.css">
  <style> body{background:#f5f7fb} .card-admin{border-radius:8px} </style>
</head>
<body>
  <div class="container" style="margin-top:24px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>السياسات واللوائح - إدارة</h3>
      <div><a class="btn btn-secondary" href="/HTML/admin-crud.html">العودة</a></div>
    </div>

    <div class="mb-3 d-flex gap-2">
      <button id="refresh" class="btn btn-outline-primary">تحديث القائمة</button>
      <button id="add-new" class="btn btn-outline-success">إضافة سياسة/لائحة</button>
    </div>

    <div id="items"></div>

    <!-- Create Modal -->
    <div id="create-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:8px;padding:18px;max-width:640px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,0.2);direction:rtl;text-align:right">
        <h4 style="margin-top:0">إضافة سياسة / لائحة</h4>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label>اسم السياسة (PolicyName)</label>
          <input id="create-name" type="text" class="form-control">
          <label>الملف (PolicyURL) - اختر ملف PDF أو صورة أو أي ملف</label>
          <input id="create-file" type="file" class="form-control">
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button id="create-cancel" class="btn btn-secondary">إلغاء</button>
            <button id="create-submit" class="btn btn-success">إنشاء</button>
          </div>
          <div id="create-msg" style="color:#333;font-size:0.95rem;margin-top:6px"></div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:8px;padding:18px;max-width:640px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,0.2);direction:rtl;text-align:right">
        <h4 style="margin-top:0">تعديل السياسة / اللائحة</h4>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label>اسم السياسة (PolicyName)</label>
          <input id="edit-name" type="text" class="form-control">
          <label>تغيير الملف (اختياري)</label>
          <input id="edit-file" type="file" class="form-control">
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button id="edit-cancel" class="btn btn-secondary">إلغاء</button>
            <button id="edit-submit" class="btn btn-primary">حفظ</button>
          </div>
          <div id="edit-msg" style="color:#333;font-size:0.95rem;margin-top:6px"></div>
        </div>
      </div>
    </div>

  </div>

<script>
  const API = 'https://tanmia.nasatechnology.net/api/Policies_and_regulations';
  const itemsEl = document.getElementById('items');

  function showResult(title, data){ console.log(title, data); }

  async function loadItems(){
    itemsEl.innerHTML = '<div class="text-muted">جاري التحميل...</div>';
    try{
      const res = await fetch(API);
      if(!res.ok) throw new Error('Status ' + res.status);
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data && data.data ? data.data : []);
      const visible = list.filter(item => !(item && (item.isDelete == 1 || item.isDelete === '1' || item.isDelete === true)));
      renderList(visible);
    }catch(err){ itemsEl.innerHTML = '<div class="text-danger">فشل في جلب البيانات</div>'; showResult('خطأ في التحميل', err); }
  }

  function renderList(arr){
    itemsEl.innerHTML = '';
    if(!arr || arr.length === 0){ itemsEl.innerHTML = '<div class="text-muted">لا توجد سياسات</div>'; itemsEl._list = []; return; }
    arr.forEach((item, idx)=>{
      const url = item.PolicyURL || item.policyUrl || item.policyURL || '';
      const urlName = (function(){ try{ if(url){ try{ return decodeURIComponent((new URL(url)).pathname.split('/').pop()) }catch(e){ return url } } return null }catch(e){ return null } })();
      const name = item.policyName || item.PolicyName || item.Policyname || urlName || '(بدون اسم)';
      const card = document.createElement('div');
      card.className = 'card mb-2';
      card.innerHTML = `
        <div class="card-body d-flex align-items-center">
          <div class="flex-grow-1">
            <strong>${name}</strong>
            ${url ? '<div><a href="'+url+'" target="_blank">فتح الملف</a></div>' : ''}
          </div>
          <div class="btn-group">
            <button class="btn btn-sm btn-outline-warning" data-idx="${idx}" data-action="edit">تعديل</button>
            <button class="btn btn-sm btn-outline-danger" data-idx="${idx}" data-action="delete">حذف</button>
          </div>
        </div>
      `;
      itemsEl.appendChild(card);
    });
    itemsEl._list = arr;
  }

  document.addEventListener('click', async (e)=>{
    const btn = e.target.closest('button'); if(!btn) return;
    if(btn.id === 'refresh') return loadItems();
    if(btn.id === 'add-new') return openCreateModal();
    const action = btn.dataset.action; const idx = btn.dataset.idx; if(!action) return;
    const list = itemsEl._list || []; const item = list[idx]; if(!item) return alert('العنصر غير موجود');
    const id = item.id || item._id || item.ID || item.Id;
    if(action === 'delete'){
      const displayName = item.policyName || item.PolicyName || item.Policyname || '';
      openDeleteConfirm('هل أنت متأكد من حذف العنصر "' + displayName + '"؟', async ()=>{
        const token = localStorage.getItem('authToken'); if(!token){ alert('غير مسجل دخول'); return }
        const res = await fetch(API + '/' + encodeURIComponent(id), { method:'DELETE', headers: { 'Authorization':'Bearer '+token } });
        if(res.ok) loadItems();
      });
      return;
    }
    if(action === 'edit'){
      openEditModal(item, id);
      return;
    }
  });

  function openCreateModal(){
    const modal = document.getElementById('create-modal');
    const nameEl = document.getElementById('create-name'); const fileEl = document.getElementById('create-file'); const msg = document.getElementById('create-msg');
    nameEl.value = ''; fileEl.value = null; msg.textContent = '';
    modal.style.display = 'flex';

    const submit = document.getElementById('create-submit'); const cancel = document.getElementById('create-cancel');
    const onCancel = ()=>{ modal.style.display='none'; cleanup(); };
    const onSubmit = async ()=>{
      const name = nameEl.value.trim(); const file = fileEl.files[0];
      if(!name){ msg.textContent='أدخل اسم السياسة'; return }
      const token = localStorage.getItem('authToken'); if(!token){ alert('غير مسجل دخول'); return }
      try{
        const form = new FormData();
        form.append('PolicyName', name); form.append('policyName', name);
        if(file){ form.append('PolicyURL', file); form.append('policyUrl', file); }
        const res = await fetch(API, { method:'POST', headers: { 'Authorization':'Bearer '+token }, body: form });
        const txt = await res.text(); let data; try{ data = JSON.parse(txt);}catch(e){ data = txt }
        showResult('POST policies → '+res.status, data);
        if(res.ok){ modal.style.display='none'; cleanup(); loadItems(); } else msg.textContent='فشل الإنشاء';
      }catch(err){ console.error(err); msg.textContent='خطأ في الاتصال'; }
    };
    function cleanup(){ submit.removeEventListener('click', onSubmit); cancel.removeEventListener('click', onCancel); }
    submit.addEventListener('click', onSubmit); cancel.addEventListener('click', onCancel);
    modal.onclick = function(e){ if(e.target===modal){ modal.style.display='none'; cleanup(); } };
  }

  function openEditModal(item, id){
    const modal = document.getElementById('edit-modal'); const nameEl = document.getElementById('edit-name'); const fileEl = document.getElementById('edit-file'); const msg = document.getElementById('edit-msg');
    nameEl.value = item.policyName || item.PolicyName || item.Policyname || '';
    fileEl.value = null; msg.textContent = '';
    modal.style.display = 'flex';

    const submit = document.getElementById('edit-submit'); const cancel = document.getElementById('edit-cancel');
    const onCancel = ()=>{ modal.style.display='none'; cleanup(); };
    const onSubmit = async ()=>{
      const newName = nameEl.value.trim(); const newFile = fileEl.files[0];
      if(!newName){ msg.textContent='أدخل اسم السياسة'; return }
      const token = localStorage.getItem('authToken'); if(!token){ alert('غير مسجل دخول'); return }
      try{
        const form = new FormData(); form.append('PolicyName', newName); form.append('policyName', newName);
        if(newFile){ form.append('PolicyURL', newFile); form.append('policyUrl', newFile); }
        const res = await fetch(API + '/' + encodeURIComponent(id), { method:'PUT', headers: { 'Authorization':'Bearer '+token }, body: form });
        const txt = await res.text(); let data; try{ data = JSON.parse(txt);}catch(e){ data = txt }
        showResult('PUT policies → '+res.status, data);
        if(res.ok){ modal.style.display='none'; cleanup(); loadItems(); } else msg.textContent='فشل الحفظ';
      }catch(err){ console.error(err); msg.textContent='خطأ في الاتصال'; }
    };
    function cleanup(){ submit.removeEventListener('click', onSubmit); cancel.removeEventListener('click', onCancel); }
    submit.addEventListener('click', onSubmit); cancel.addEventListener('click', onCancel);
    modal.onclick = function(e){ if(e.target===modal){ modal.style.display='none'; cleanup(); } };
  }

  // init
  loadItems();
</script>

<!-- Delete confirmation modal and helper -->
<div id="confirm-delete-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99999;align-items:center;justify-content:center">
  <div style="background:#fff;padding:18px;border-radius:8px;max-width:520px;width:100%;direction:rtl;text-align:right;box-shadow:0 6px 20px rgba(0,0,0,0.12);">
    <h5 style="margin-top:0">تأكيد الحذف</h5>
    <div class="modal-msg" style="margin-bottom:12px;color:#333"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button class="btn btn-secondary modal-cancel">إلغاء</button>
      <button class="btn btn-danger modal-ok">حذف</button>
    </div>
  </div>
</div>
<script>
function openDeleteConfirm(message, onConfirm){
  const modal = document.getElementById('confirm-delete-modal');
  modal.querySelector('.modal-msg').textContent = message;
  modal.style.display = 'flex';
  const ok = modal.querySelector('.modal-ok');
  const cancel = modal.querySelector('.modal-cancel');
  const cleanup = ()=>{ modal.style.display='none'; ok.removeEventListener('click',okHandler); cancel.removeEventListener('click',cancelHandler); };
  const okHandler = async ()=>{ cleanup(); try{ await onConfirm(); }catch(e){ console.error(e); } };
  const cancelHandler = ()=>{ cleanup(); };
  ok.addEventListener('click', okHandler);
  cancel.addEventListener('click', cancelHandler);
  modal.onclick = (e)=>{ if(e.target === modal) cleanup(); };
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/JS/custom-alert.js"></script>
</body>
</html>
