<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة - التطوع</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Base.css">
  <style>
    body { background: #f5f7fb; }
    label { font-weight: 600; }
    .section-card { border: 1px solid #007c8b; }
    .section-card .card-header { background: #007c8b; color: #fff; }
  </style>
</head>
<body>
  <div class="container" style="margin-top:24px; max-width:700px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3>التطوع - إدارة</h3>
      <a class="btn btn-secondary" href="/HTML/admin-crud.html">العودة</a>
    </div>

    <!-- النص الرئيسي -->
    <div class="card section-card mb-4">
      <div class="card-header">النص الرئيسي</div>
      <div class="card-body">
        <textarea id="vol-info" class="form-control" rows="4" placeholder="النص التعريفي عن التطوع..."></textarea>
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-key="volInfo" data-src="vol-info">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- إحصائية الساعات -->
    <div class="card section-card mb-4">
      <div class="card-header">إحصائية الساعات التطوعية</div>
      <div class="card-body">
        <textarea id="vol-stats" class="form-control" rows="2" placeholder="مثال: بلغ عدد الساعات التطوعيه لعام ٢٠٢٤م ما يقارب ٤٥٢ ساعه تطوعية من ٢٣ فرصه تطوعيه"></textarea>
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-key="volStats" data-src="vol-stats">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- جملة الدعوة -->
    <div class="card section-card mb-4">
      <div class="card-header">جملة الدعوة (نسعد أن تكون جزء منا)</div>
      <div class="card-body">
        <input id="vol-invite" type="text" class="form-control" placeholder="نسعد أن تكون جزء منا">
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-key="volInvite" data-src="vol-invite">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- رابط واتساب -->
    <div class="card section-card mb-4">
      <div class="card-header">رابط واتساب للتطوع</div>
      <div class="card-body">
        <input id="vol-whatsapp" type="text" class="form-control" placeholder="https://wa.me/+966XXXXXXXXX">
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-key="volWhatsapp" data-src="vol-whatsapp">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

  </div>

  <script>
    const fields = {
      volInfo:      'vol-info',
      volStats:     'vol-stats',
      volInvite:    'vol-invite',
      volWhatsapp:  'vol-whatsapp'
    };

    const defaults = {
      volInfo:     'تتيح الجمعية فرص تطوعية إدارية ومكتبية ، سامة وعطاء التابع للجمعية ، نحفظ بصحبة فريق ابت حق المتطوع بتسجيل ساعاته التطوعية عبر منصة العمل التطوعي',
      volStats:    'بلغ عدد  الساعات التطوعيه لعام ٢٠٢٤م ما يقارب ٤٥٢ ساعه تطوعية من ٢٣ فرصه تطوعيه',
      volInvite:   'نسعد أن تكون جزء منا',
      volWhatsapp: 'https://wa.me/+966535303406'
    };

    Object.entries(fields).forEach(([key, id]) => {
      document.getElementById(id).value = localStorage.getItem(key) || defaults[key];
    });

    document.querySelectorAll('.save-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = document.getElementById(btn.dataset.src).value;
        localStorage.setItem(btn.dataset.key, val);
        const msg = btn.closest('.card-body').querySelector('.save-msg');
        msg.innerHTML = '<span class="text-success">✓ تم الحفظ بنجاح!</span>';
        setTimeout(() => msg.innerHTML = '', 3000);
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
