<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة - الصفحة الرئيسية</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Base.css">
  <style>
    body { background: #f5f7fb; }
    .preview-img { max-width: 100%; max-height: 180px; border-radius: 8px; margin-top: 8px; display: none; }
    label { font-weight: 600; }
  </style>
</head>
<body>
  <div class="container" style="margin-top:24px; max-width:700px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>الصفحة الرئيسية - إدارة</h3>
      <a class="btn btn-secondary" href="/HTML/admin-crud.html">العودة</a>
    </div>

    <!-- Stats card -->
    <div class="card mb-4" style="border:1px solid #007c8b;">
      <div class="card-header text-white" style="background:#007c8b;">الأرقام (متطوعين / مستفيدين / السنة)</div>
      <div class="card-body d-flex flex-column gap-3">
        <div>
          <label for="volunteers-input">عدد المتطوعين</label>
          <input id="volunteers-input" type="number" class="form-control" placeholder="مثال: 709">
        </div>
        <div>
          <label for="beneficiaries-input">عدد المستفيدين</label>
          <input id="beneficiaries-input" type="number" class="form-control" placeholder="مثال: 3250">
        </div>
        <div>
          <label for="year-input">السنة في نص المستفيد (مثال: ٢٠٢٤م)</label>
          <input id="year-input" type="text" class="form-control" placeholder="٢٠٢٤م">
        </div>
        <div class="d-flex justify-content-end">
          <button id="save-stats" class="btn btn-success">حفظ الأرقام</button>
        </div>
        <div id="stats-msg"></div>
      </div>
    </div>

    <!-- Slide 1 -->
    <div class="card mb-4" style="border:1px solid #007c8b;">
      <div class="card-header text-white" style="background:#007c8b;">صورة السلايدر الأولى</div>
      <div class="card-body">
        <label for="slide1-file">اختر صورة جديدة</label>
        <input id="slide1-file" type="file" accept="image/*" class="form-control">
        <img id="slide1-preview" class="preview-img" alt="معاينة الصورة الأولى">
        <div class="mt-2 d-flex justify-content-end">
          <button id="save-slide1" class="btn btn-success">حفظ الصورة الأولى</button>
        </div>
        <div id="slide1-msg" class="mt-2"></div>
      </div>
    </div>

    <!-- Slide 2 -->
    <div class="card mb-4" style="border:1px solid #007c8b;">
      <div class="card-header text-white" style="background:#007c8b;">صورة السلايدر الثانية</div>
      <div class="card-body">
        <label for="slide2-file">اختر صورة جديدة</label>
        <input id="slide2-file" type="file" accept="image/*" class="form-control">
        <img id="slide2-preview" class="preview-img" alt="معاينة الصورة الثانية">
        <div class="mt-2 d-flex justify-content-end">
          <button id="save-slide2" class="btn btn-success">حفظ الصورة الثانية</button>
        </div>
        <div id="slide2-msg" class="mt-2"></div>
      </div>
    </div>
  </div>

  <script>
    // Load existing stats
    function loadStats() {
      const data = JSON.parse(localStorage.getItem('homeStats') || '{}');
      if (data.volunteers) document.getElementById('volunteers-input').value = data.volunteers;
      if (data.beneficiaries) document.getElementById('beneficiaries-input').value = data.beneficiaries;
      if (data.year) document.getElementById('year-input').value = data.year;
    }

    document.getElementById('save-stats').addEventListener('click', () => {
      const data = JSON.parse(localStorage.getItem('homeStats') || '{}');
      data.volunteers = document.getElementById('volunteers-input').value.trim();
      data.beneficiaries = document.getElementById('beneficiaries-input').value.trim();
      data.year = document.getElementById('year-input').value.trim();
      localStorage.setItem('homeStats', JSON.stringify(data));
      const msg = document.getElementById('stats-msg');
      msg.innerHTML = '<span class="text-success">تم حفظ الأرقام بنجاح!</span>';
      setTimeout(() => msg.innerHTML = '', 3000);
    });

    // Slide helpers
    function setupSlide(fileId, previewId, saveId, msgId, storageKey) {
      const fileInput = document.getElementById(fileId);
      const preview = document.getElementById(previewId);
      const saveBtn = document.getElementById(saveId);
      const msg = document.getElementById(msgId);

      // Show current saved image
      const existing = localStorage.getItem(storageKey);
      if (existing) { preview.src = existing; preview.style.display = 'block'; }

      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
        reader.readAsDataURL(file);
      });

      saveBtn.addEventListener('click', () => {
        const file = fileInput.files[0];
        if (!file) { msg.innerHTML = '<span class="text-danger">يرجى اختيار صورة أولاً.</span>'; return; }
        const reader = new FileReader();
        reader.onload = e => {
          localStorage.setItem(storageKey, e.target.result);
          msg.innerHTML = '<span class="text-success">تم حفظ الصورة بنجاح!</span>';
          setTimeout(() => msg.innerHTML = '', 3000);
        };
        reader.readAsDataURL(file);
      });
    }

    loadStats();
    setupSlide('slide1-file', 'slide1-preview', 'save-slide1', 'slide1-msg', 'homeSlide1');
    setupSlide('slide2-file', 'slide2-preview', 'save-slide2', 'slide2-msg', 'homeSlide2');
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
