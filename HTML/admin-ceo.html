<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة - المدير التنفيذي</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Base.css">
  <style>
    body { background: #f5f7fb; }
    label { font-weight: 600; }
    .section-card { border: 1px solid #007c8b; }
    .section-card .card-header { background: #007c8b; color: #fff; }
    #ceo-preview { max-width: 200px; max-height: 200px; border-radius: 10px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="container" style="margin-top:24px; max-width:650px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3>المدير التنفيذي - إدارة</h3>
      <a class="btn btn-secondary" href="/HTML/admin-crud.html">العودة</a>
    </div>

    <!-- الاسم -->
    <div class="card section-card mb-4">
      <div class="card-header">الاسم</div>
      <div class="card-body">
        <input id="ceo-name" type="text" class="form-control" placeholder="فهد بن سليمان القناص">
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-field="name" data-src="ceo-name">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- رقم الهاتف -->
    <div class="card section-card mb-4">
      <div class="card-header">رقم الهاتف</div>
      <div class="card-body">
        <input id="ceo-phone" type="text" class="form-control" placeholder="541476699 966 +">
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-field="phone" data-src="ceo-phone">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- الايميل -->
    <div class="card section-card mb-4">
      <div class="card-header">البريد الإلكتروني</div>
      <div class="card-body">
        <input id="ceo-email" type="email" class="form-control" placeholder="fahd511@gmail.com">
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-field="email" data-src="ceo-email">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- الصورة -->
    <div class="card section-card mb-4">
      <div class="card-header">الصورة الشخصية</div>
      <div class="card-body">
        <input id="ceo-file" type="file" accept="image/*" class="form-control">
        <img id="ceo-preview" alt="معاينة">
        <div class="d-flex justify-content-end mt-2">
          <button id="save-image" class="btn btn-success">حفظ الصورة</button>
        </div>
        <div id="img-msg" class="mt-1"></div>
      </div>
    </div>

  </div>

  <script>
    // Load saved values
    const data = JSON.parse(localStorage.getItem('ceoData') || '{}');
    if (data.name)  document.getElementById('ceo-name').value  = data.name;
    if (data.phone) document.getElementById('ceo-phone').value = data.phone;
    if (data.email) document.getElementById('ceo-email').value = data.email;
    if (data.image) { const p = document.getElementById('ceo-preview'); p.src = data.image; p.style.display = 'block'; }

    // Text fields save
    document.querySelectorAll('.save-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = JSON.parse(localStorage.getItem('ceoData') || '{}');
        d[btn.dataset.field] = document.getElementById(btn.dataset.src).value.trim();
        localStorage.setItem('ceoData', JSON.stringify(d));
        const msg = btn.closest('.card-body').querySelector('.save-msg');
        msg.innerHTML = '<span class="text-success">تم الحفظ بنجاح!</span>';
        setTimeout(() => msg.innerHTML = '', 3000);
      });
    });

    // Image preview
    document.getElementById('ceo-file').addEventListener('change', function () {
      const file = this.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const p = document.getElementById('ceo-preview');
        p.src = e.target.result; p.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    // Image save
    document.getElementById('save-image').addEventListener('click', () => {
      const file = document.getElementById('ceo-file').files[0];
      const msg = document.getElementById('img-msg');
      if (!file) { msg.innerHTML = '<span class="text-danger">يرجى اختيار صورة أولاً.</span>'; return; }
      const reader = new FileReader();
      reader.onload = e => {
        const d = JSON.parse(localStorage.getItem('ceoData') || '{}');
        d.image = e.target.result;
        localStorage.setItem('ceoData', JSON.stringify(d));
        msg.innerHTML = '<span class="text-success">تم حفظ الصورة بنجاح!</span>';
        setTimeout(() => msg.innerHTML = '', 3000);
      };
      reader.readAsDataURL(file);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
