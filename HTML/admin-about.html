<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة - من نحن</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Base.css">
  <style>
    body { background: #f5f7fb; }
    label { font-weight: 600; }
    .section-card { border: 1px solid #007c8b; }
    .section-card .card-header { background: #007c8b; color: #fff; }
    .hint { font-size: 0.85rem; color: #666; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container" style="margin-top:24px; max-width:750px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3>من نحن - إدارة</h3>
      <a class="btn btn-secondary" href="/HTML/admin-crud.html">العودة</a>
    </div>

    <!-- Intro -->
    <div class="card section-card mb-4">
      <div class="card-header">المقدمة (الفقرة الرئيسية)</div>
      <div class="card-body">
        <textarea id="about-intro" class="form-control" rows="4"></textarea>
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-key="aboutIntro" data-src="about-intro">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- رؤيتنا -->
    <div class="card section-card mb-4">
      <div class="card-header">رؤيتنا</div>
      <div class="card-body">
        <textarea id="about-vision" class="form-control" rows="3"></textarea>
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-key="aboutVision" data-src="about-vision">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- رسالتنا -->
    <div class="card section-card mb-4">
      <div class="card-header">رسالتنا</div>
      <div class="card-body">
        <textarea id="about-mission" class="form-control" rows="3"></textarea>
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-key="aboutMission" data-src="about-mission">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- أهدافنا -->
    <div class="card section-card mb-4">
      <div class="card-header">أهدافنا</div>
      <div class="card-body">
        <textarea id="about-goals" class="form-control" rows="7"></textarea>
        <p class="hint">كل سطر = هدف واحد في القائمة</p>
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-key="aboutGoals" data-src="about-goals">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

    <!-- قيمنا -->
    <div class="card section-card mb-4">
      <div class="card-header">قيمنا</div>
      <div class="card-body">
        <textarea id="about-values" class="form-control" rows="7"></textarea>
        <p class="hint">كل سطر = قيمة واحدة في القائمة</p>
        <div class="d-flex justify-content-end mt-2">
          <button class="btn btn-success save-btn" data-key="aboutValues" data-src="about-values">حفظ</button>
        </div>
        <div class="save-msg mt-1"></div>
      </div>
    </div>

  </div>

  <script>
    const defaults = {
      aboutIntro: 'نحن جمعية التنمية الأهلية بأم الساهك ، جمعية تنموية تابعة للمركز الوطني لتنمية القطاع الغير ربحي بترخيص رقم ، نهتم بتقديم برامج اجتماعية وتنموية وثقافية 4152 متنوعة.',
      aboutVision: 'نرتقي بالمواطن وبيئته من خلال تفعيل دوره في المجتمع بمنظور شامل وأسلوب ابداعي وكفاءة عالية .',
      aboutMission: 'تقديم خدمات وبرامج اجتماعية وتنموية في مركز أم الساهك والأحياء التابعة لخدمات الجمعية ذات جودة مميزة من خلال جتمعية قيادة مبدعة وأساليب إدارية متميزة ومشاركة م واسعة .',
      aboutGoals: 'تقديم برامج تربوية وصحية وثقافية هادفة لجميع فئات المجتمع .\nتشجيع الجهود التطوعية وتنظيمها والعمل على ترابطها لخدمة المجتمع\nبناء شراكات استراتيجية مع المؤسسات الحكومية ومؤسسات المجتمع المدني .\nتحقيق الاستدامة المالية .\nاكتشاف الكفاءات الاجتماعية وتأهيلها لتحقيق التنمية المستدامة .\nماشيًا مع رؤية 2030 نعمل على زيادة عدد المتطوعين وتعزيز قدراتهم ورفع كفاءتهم التدريبية.',
      aboutValues: 'الشفافية والنزاهة\nالاخلاص والابتكار\nالعمل بروح الفريق\nالالتزام بالجودة\nنعتز بهويتنا الوطنيه\nالمسؤولية المجتمعية'
    };

    const fields = {
      aboutIntro:   'about-intro',
      aboutVision:  'about-vision',
      aboutMission: 'about-mission',
      aboutGoals:   'about-goals',
      aboutValues:  'about-values'
    };

    // Load saved or default values
    Object.entries(fields).forEach(([key, id]) => {
      document.getElementById(id).value = localStorage.getItem(key) || defaults[key];
    });

    // Save buttons
    document.querySelectorAll('.save-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        const val = document.getElementById(btn.dataset.src).value;
        localStorage.setItem(key, val);
        const msg = btn.closest('.card-body').querySelector('.save-msg');
        msg.innerHTML = '<span class="text-success">تم الحفظ بنجاح!</span>';
        setTimeout(() => msg.innerHTML = '', 3000);
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
